<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <title>প্রফেশনাল লোগো - মোবাশ্বিরা পশু পাখির ওষুধ ঘর</title>
  <style>
    body {
      background: #060d17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .preview-card {
      background: radial-gradient(circle at center, #0f1f38 0%, #08101d 100%);
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.15);
      border: 1.5px solid #1e3a5f;
      text-align: center;
    }
    svg {
      width: 460px;
      height: 460px;
      display: block;
    }
    .badge {
      margin-top: 18px;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
      <defs>
        <!-- Gradients -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fde68a" />
          <stop offset="50%" stop-color="#d97706" />
          <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#34d399" />
          <stop offset="100%" stop-color="#059669" />
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <radialGradient id="innerGlow" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#0b132b" stop-opacity="0.95"/>
        </radialGradient>
      </defs>

      <!-- Outer Metallic Ring -->
      <circle cx="300" cy="300" r="280" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="5" />
      <circle cx="300" cy="300" r="264" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" />

      <!-- Center Heraldic Shield -->
      <path d="M300 65 C385 65, 435 95, 435 195 C435 295, 300 345, 300 345 C300 345, 165 295, 165 195 C165 95, 215 65, 300 65 Z" 
            fill="#091424" stroke="url(#emeraldGrad)" stroke-width="3.5" />

      <!-- Medical Cross at top -->
      <g transform="translate(0, -15)">
        <path d="M292 90 h16 v12 h12 v16 h-12 v12 h-16 v-12 h-12 v-16 h12 z" fill="url(#goldGrad)" />
      </g>

      <!-- REALISTIC VECTOR SILHOUETTES -->

      <!-- 1. COW PROFILE SILHOUETTE (Left side) -->
      <g fill="#f8fafc" opacity="0.95">
        <!-- Cow Face & Horn Arc -->
        <path d="M210 135 C200 115 175 105 160 110 C170 120 185 130 190 145 C170 148 155 165 158 185 C162 205 180 215 200 218 C205 235 220 250 240 255 C248 245 245 225 240 215 C245 195 245 165 230 145 C222 135 215 135 210 135 Z" />
        <!-- Cow Horn Gold Accent -->
        <path d="M208 138 C198 116 172 108 160 110 C172 118 188 126 194 144 Z" fill="url(#goldGrad)" />
        <!-- Cow Eye Shadow -->
        <circle cx="205" cy="168" r="3.5" fill="#091424" />
      </g>

      <!-- 2. GOAT PROFILE SILHOUETTE (Right side) -->
      <g fill="#e2e8f0" opacity="0.95">
        <!-- Goat Face, Horn & Beard -->
        <path d="M390 135 C400 115 425 105 440 110 C430 120 415 130 410 145 C430 148 445 165 442 185 C438 205 420 215 400 218 C395 235 380 250 360 255 C352 245 355 225 360 215 C355 195 355 165 370 145 C378 135 385 135 390 135 Z" />
        <!-- Goat Horn Gold Accent -->
        <path d="M392 138 C402 116 428 108 440 110 C428 118 412 126 406 144 Z" fill="url(#goldGrad)" />
        <!-- Goat Eye Shadow -->
        <circle cx="395" cy="168" r="3.5" fill="#091424" />
      </g>

      <!-- 3. BIRD IN FLIGHT (Center Symbol) -->
      <g transform="translate(300, 195)">
        <path d="M0 -35 C-28 -15 -35 15 0 35 C35 15 28 -15 0 -35 Z" fill="url(#cyanGrad)" />
        <path d="M0 -35 C-12 -20 -15 0 0 15 C15 0 12 -20 0 -35 Z" fill="#ffffff" opacity="0.8" />
        <polygon points="0,-42 -5,-33 5,-33" fill="url(#goldGrad)" />
      </g>

      <!-- Medical Laurel Wreath Arc -->
      <path d="M145 210 C145 290 210 340 300 340 C390 340 455 290 455 210" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round" />

      <!-- TYPOGRAPHY SECTION -->

      <!-- Main Business Name -->
      <text x="300" y="415" font-family="'Segoe UI', 'Noto Sans Bengali', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
        মোবাশ্বিরা
      </text>

      <!-- Subtitle -->
      <text x="300" y="465" font-family="'Segoe UI', 'Noto Sans Bengali', sans-serif" font-size="26" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">
        পশু পাখির ওষুধ ঘর
      </text>

      <!-- Professional Badge -->
      <rect x="140" y="498" width="320" height="36" rx="18" fill="#0b172a" stroke="url(#emeraldGrad)" stroke-width="1.8" />
      <text x="300" y="522" font-family="'Segoe UI', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="0.5">
        ভেটেরিনারি মেডিসিন ও চিকিৎসা সেবা
      </text>
    </svg>
    <div class="badge">মোবাশ্বিরা পশু পাখির ওষুধ ঘর (অফিশিয়াল এমব্লেম)</div>
  </div>
</body>
</html>
